<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500" role="img" aria-label="Ilustración: espacio de psicoterapia cálido y cercano">
  <title>Espacio de acompañamiento — Rosa Briceño</title>
  <rect width="400" height="500" fill="#EADFD5"/>

  <!-- fondo orgánico -->
  <circle cx="320" cy="90" r="120" fill="#FBD2BB" opacity="0.55"/>
  <circle cx="40" cy="440" r="140" fill="#F4A582" opacity="0.35"/>

  <!-- silla / asiento -->
  <rect x="120" y="330" width="160" height="110" rx="30" fill="#D8C7B8"/>

  <!-- figura sentada, estilo minimalista -->
  <ellipse cx="200" cy="230" rx="46" ry="50" fill="#6B5B53"/>
  <path d="M140 300c0-45 30-70 60-70s60 25 60 70v70c0 14-10 24-24 24H164c-14 0-24-10-24-24v-70Z" fill="#F4A582"/>
  <path d="M150 340c-14 20-16 45-10 66M250 340c14 20 16 45 10 66" stroke="#6B5B53" stroke-width="10" stroke-linecap="round" fill="none"/>

  <!-- planta decorativa -->
  <rect x="308" y="392" width="34" height="40" rx="6" fill="#6F8FA3"/>
  <path d="M325 392c0-30 -22-40-30-70 30 6 46 34 40 60 -2 8 -6 8 -10 10Z" fill="#7FAE86"/>
  <path d="M325 392c0-26 22-34 30-62 -26 4 -42 30 -38 54 2 8 6 6 8 8Z" fill="#8FBF97"/>

  <!-- taza -->
  <rect x="70" y="410" width="34" height="24" rx="6" fill="#FFF8F3"/>
  <path d="M104 416h8a8 8 0 0 1 0 16h-8" stroke="#FFF8F3" stroke-width="5" fill="none"/>
</svg>
